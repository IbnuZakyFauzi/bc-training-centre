<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 180" width="200" height="180">
    <!-- Text Row: "berau" (dark gray) + "coal" (green) -->
    <text x="4" y="38" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="36" letter-spacing="-0.5">
        <tspan fill="#3d3d3d">berau</tspan><tspan fill="#6cbf2e"> coal</tspan>
    </text>

    <!-- Emblem Group, centered below text -->
    <g transform="translate(14, 50)">

        <!-- Bar 1 (top-left diagonal) -->
        <rect x="0" y="0" width="110" height="18" rx="9" fill="#6cbf2e"
              transform="rotate(-30, 55, 9)" />

        <!-- Bar 2 (middle diagonal) -->
        <rect x="16" y="28" width="100" height="18" rx="9" fill="#6cbf2e"
              transform="rotate(-30, 66, 37)" />

        <!-- Bar 3 (bottom-right diagonal) -->
        <rect x="32" y="56" width="88" height="18" rx="9" fill="#6cbf2e"
              transform="rotate(-30, 76, 65)" />

        <!-- Diamond frame (dark charcoal, no fill) -->
        <polygon points="82,52  130,80  82,110  34,82"
                 fill="none" stroke="#3d3d3d" stroke-width="12"
                 stroke-linejoin="round" />
    </g>
</svg>
